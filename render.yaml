services:
  - type: web
    name: class-album
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build:render
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: class-album-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: class-album-db
    plan: free
    databaseName: class_album
    user: postgres
    region: oregon
